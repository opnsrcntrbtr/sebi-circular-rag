# SEBI Circular RAG service configuration.
# Any field can be overridden by an env var SEBI_RAG_<FIELD> (uppercased).
# Secrets are NOT here: set SEBI_RAG_API_KEY in the environment.

[service]
generator = "mlx"                                      # mlx | ollama
mlx_model = "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
# Screened 2026-08-20 (reports/mechanism-screen-*.json, n=50): citation-bracket
# firing rate 1.5B 0.0% | 3B 7.1% | 7B 47.6%. "3B for higher groundedness" was the
# prior note here and is WITHDRAWN — 3B is barely above zero. 7B is the only size
# that follows the instruction, and it does NOT breach timeout_s: the 3-row tail
# seen in the first probe was irreproducible external load, not row cost — two
# clean runs give max 13.8 s / 14.1 s and 0 violations
# (reports/timeout-tail-disconfound.json). 7B is unblocked on latency grounds.
top_k = 10                                             # increased from 5: citation_recall 0.772 → 0.888 (doc_id dedup + wider top_k)
abstain_threshold = 0.05                               # far-domain score floor; near-domain
                                                       # abstention = subject-sim gate (SEBI_RAG_GATE)
superseded_penalty = 0.3                               # demote superseded chunks in rerank
rate_per_min = 60                                      # per key/IP
timeout_s = 30                                         # /query budget -> 504
# corpus_path and index_dir default to data/corpus/circulars.jsonl and data/index

# Apple-Silicon compute (Track B). Omit `device` to auto-detect (mps else cpu).
# device = "mps"                                       # force: mps | cpu | cuda
use_fp16 = false                                       # fp16 on mps/cuda (never bf16); flipped by eval gate
encode_batch_size = 32                                 # embed/rerank batch size (MPS prefers larger)
embed_backend = "torch"                                # torch | mlx  (mlx = eval-gated, Phase 2)
rerank_backend = "torch"                               # torch | mlx  (mlx = eval-gated, Phase 2)

# Generator the gate is BOTH derived and measured under (derive_thresholds.py +
# eval_json.py route through generate.eval_generator_for). "mlx" = production
# parity. Set 2026-08-12: floors were previously derived under the extractive
# stub, which overstates B' citation failures ~2x (34 rows vs 19 under MLX) and
# understates citation_recall. Cost: the eval stack now loads MLX (~4x slower,
# ~20 min over 260 rows) and is only reproducible on Apple Silicon.
eval_generator = "mlx"                                 # stub | mlx

# Paraphrase rescue (prereg docs/superpowers/specs/2026-08-19-ce-paraphrase-rescue-prereg.md).
# When rerank_top falls below abstain_threshold, rewrite the query into SEBI
# vocabulary from the retrieved pool and re-rank the SAME pool once. OFF until
# the preregistered cohort + full-eval confirmation pass (§6, §7).
paraphrase_rescue = false                              # true = rescue below the score floor

citation_scorer_enabled = true                         # B': post-hoc cross-encoder citation filter (gate armed under B' 2026-08-04)
citation_margin = 0.35                                  # sigmoid-scale; MLX-parallel sweep knee (P +5.4%, recall 0.8721, n=219)

# Hugging Face Spaces demo (CPU-only). Read ONLY by Settings.load_spaces();
# the Apple-Silicon local stack above is unaffected. Env prefix: SEBI_RAG_SPACES_.
[spaces]
dataset_repo       = "opnsrcntrbtrian/sebi-circulars"  # HF dataset: corpus source
index_repo         = "opnsrcntrbtrian/sebi-circulars-index"  # HF dataset repo with prebuilt data/index
default_config     = "chunks"                          # "chunks" | "corpus"
default_subset     = "full"                            # "full" | "recent"
recent_years       = [2025, 2026]
external_space     = "Qwen/Qwen2.5-7B-Instruct"  # HF model Space for generation (faster, more reliable than shared public Spaces)
external_api_name  = "/generate"
external_timeout_s = 30.0                              # live-tested 2026-07-10: queue time on this
                                                       # shared public Space ranged 7-23s; 20s caused
                                                       # avoidable fallbacks
hf_model           = "Qwen/Qwen2.5-0.5B-Instruct"      # CPU fallback generator (same family as local MLX model)
max_tokens         = 200                               # matches MLXGenerator default; CPU-latency bound
temperature        = 0.2
top_p              = 0.9
top_k              = 3
timeout_s          = 60.0
abstain_threshold  = 0.05                              # copied from [service]
superseded_penalty = 0.3                               # copied from [service]
