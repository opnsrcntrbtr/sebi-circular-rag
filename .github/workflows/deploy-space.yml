name: Deploy HF Space

# Keeps opnsrcntrbtrian/sebi-circular-rag-demo in sync with main. Before this
# workflow existed, deployment was a manual, un-scheduled step: the fix in
# b34454b (2026-08-16) sat un-deployed for 11 days while 84ea79e (2026-08-27)
# diagnosed the live Space's stale behavior as a still-open bug. See
# scripts/deploy_space.py and README-spaces.md § Deploying.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/sebi_rag/**"
      - "config.toml"
      - "requirements-spaces.txt"
      - "README-spaces.md"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch: {}  # manual re-run from the Actions tab if needed

concurrency:
  group: deploy-space
  cancel-in-progress: false  # let an in-flight deploy finish; don't interleave uploads

permissions:
  contents: read  # this job never writes back to the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scopes HF_TOKEN to this environment rather than the whole repo. Create
    # it once under Settings -> Environments -> New environment
    # ("space-deploy"), attach HF_TOKEN there (not as a bare repo secret),
    # and optionally add required reviewers for a manual approve-to-deploy
    # gate. The job fails at the deploy step, with no partial upload, until
    # this environment + secret exist.
    environment: space-deploy
    steps:
      # Pinned to a commit SHA, not the mutable v4/v5 tag: this job handles
      # HF_TOKEN, so a compromised upstream action release is the realistic
      # attack surface here. Re-resolve via `gh api repos/<org>/<repo>/git/
      # refs/tags/<tag>` when bumping.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Zero extra dependencies: catches a broken app.py before it reaches
      # the Space, without installing the full ML stack (torch/faiss/etc.)
      # that app.py's own imports pull in only at Space runtime.
      - name: Syntax-check deployed files
        run: python -m compileall -q app.py src/sebi_rag

      - name: Install huggingface_hub
        run: pip install -U huggingface_hub

      - name: Deploy to HF Space
        env:
          # HfApi() reads HF_TOKEN from the environment automatically
          # (huggingface_hub.utils._auth.get_token). Set as a secret on the
          # "space-deploy" environment above (Settings -> Environments ->
          # space-deploy -> Environment secrets), not a bare repo secret —
          # a fine-grained token from https://huggingface.co/settings/tokens
          # scoped to write-only on spaces/opnsrcntrbtrian/sebi-circular-rag-demo
          # (not full-account write), with an expiration date set. Until the
          # environment + secret exist, this step fails with an auth error
          # and no partial upload happens.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py --repo opnsrcntrbtrian/sebi-circular-rag-demo

      # This job only guarantees the Space's files match main — it does not
      # wait for the rebuild or exercise the running app. Per AGENTS.md
      # "Browser Verification", behavior changes still need a live check
      # before being called done.
