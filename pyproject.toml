[project]
name = "sebi-rag"
version = "0.1.0"
description = "Local-first, Apple Silicon RAG over Indian SEBI Circulars"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
    "torch>=2.13.0",
    "sentence-transformers>=5.6.0",
    "FlagEmbedding>=1.4.0",
    "faiss-cpu>=1.14.3",
    "bm25s>=0.3.9",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "hf-xet>=1.5.1",
    "pdfplumber>=0.11.10",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "gradio>=6.20.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "reportlab>=5.0.0", "httpx>=0.28.1"]
# Standard IR scoring, used only to prove metric parity. pytrec_eval is a C
# extension, so this stays optional and the parity test skips without it.
eval = ["ir_measures>=0.3.7"]
# bge-m3 SEBI-domain LoRA fine-tuning (.claude/plans/deep-analyse-and-research-
# bright-dawn.md). peft was already present transitively (0.19.1, verified
# installed) but train_lora.py imports it directly now, so it gets an
# explicit pin rather than riding an implicit transitive dependency a future
# bump could drop. datasets is duplicated from [spaces] deliberately - the
# Apple-Silicon finetune path must not pull in the CPU Spaces demo extras
# (accelerate, gradio_client, transformers) it doesn't need.
finetune = ["peft>=0.19.0", "datasets>=3.0.0"]
# HF Spaces demo extras (CPU path); local Apple-Silicon workflow doesn't need them
spaces = [
    "datasets>=3.0.0",
    "gradio_client>=1.0.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
]
# Set-Encoder reranker benchmark candidate (2026-08-26 spec, rerank.py:SetEncoderReranker).
# Heavy vendor inference package for webis/set-encoder-base; not used by the production
# pipeline (retrieval_reranker_for/config.toml never route to it), so it stays optional.
# KNOWN ISSUE (verified 2026-08-27): lightning-ir 0.0.6 (PyPI and GitHub main) fails to
# load webis/set-encoder-base under transformers, which this project resolves transitively
# via sentence-transformers>=5.6.0 (not a direct/explicit pin) -- locked at 5.14.1 in
# uv.lock -- see docs/superpowers/specs/2026-08-26-set-encoder-prereg.md for the traceback
# and root cause.
rerank-experimental = ["lightning-ir>=0.0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises real bge-m3 / cross-encoder models (slow, needs weights)",
]

[tool.uv]
package = false
